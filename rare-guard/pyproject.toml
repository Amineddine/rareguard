[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-guard"
version = "0.1.0"
description = "Conformal, transformer-based rare-event detection for cybersecurity logs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = ["torch>=2.0","numpy>=1.24","pandas>=2.0","tqdm>=4.66","scikit-learn>=1.3","fastapi>=0.110","uvicorn[standard]>=0.27","pydantic>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
